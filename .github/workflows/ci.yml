name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20.19.x, 22.x]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - uses: pnpm/action-setup@v4    # reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, Test, Build (via Turbo)
        run: pnpm exec turbo typecheck test build --concurrency=4

      - name: CLI smoke test
        run: node packages/cli/dist/cli.js --help

      - name: Pack & install smoke test
        shell: bash
        run: |
          cd packages/cli
          pnpm pack --pack-destination "$RUNNER_TEMP"
          TARBALL=$(ls "$RUNNER_TEMP"/ngcompass-cli-*.tgz | head -1)
          mkdir -p "$RUNNER_TEMP/ngcompass-smoke"
          cd "$RUNNER_TEMP/ngcompass-smoke"
          npm install --no-save "$TARBALL"
          ./node_modules/.bin/ngcompass --version

      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20.19.x'
        run: |
          pnpm test:coverage
          node scripts/check-coverage.js

      - name: Security audit
        # --prod scopes audit to runtime dependencies only (devDep vulns don't ship to users)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20.19.x'
        run: pnpm audit --audit-level high --prod

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20.19.x'
        uses: codecov/codecov-action@v4
        with:
          directory: .
          flags: unittests
          fail_ci_if_error: false
