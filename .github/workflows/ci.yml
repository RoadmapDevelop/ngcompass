name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - uses: pnpm/action-setup@v4    # reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, Typecheck, Test, Build (via Turbo)
        run: pnpm exec turbo lint typecheck test build --concurrency=4

      - name: Security audit
        # --prod scopes audit to runtime dependencies only (devDep vulns don't ship to users)
        run: pnpm audit --audit-level high --prod

      - name: Upload coverage
        if: matrix.node == '20.x'
        uses: codecov/codecov-action@v4
        with:
          directory: .
          flags: unittests
          fail_ci_if_error: false