name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20.19.x, 22.x]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - uses: pnpm/action-setup@v4    # reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, Test, Build (via Turbo)
        run: pnpm exec turbo typecheck test build --concurrency=4

      - name: CLI smoke test
        run: node packages/cli/dist/cli.js --help

      - name: Pack & install smoke test
        shell: bash
        run: |
          PACKS_DIR="$RUNNER_TEMP/packs"
          SMOKE_DIR="$RUNNER_TEMP/ngcompass-smoke"
          mkdir -p "$PACKS_DIR" "$SMOKE_DIR"

          # Pack every workspace package so npm can resolve inter-package deps locally
          for pkg in packages/ast packages/cache packages/cli packages/common packages/config \
                     packages/engine packages/planner packages/reporters packages/rules packages/scanner; do
            (cd "$pkg" && pnpm pack --pack-destination "$PACKS_DIR")
          done

          # Install all tarballs together — npm resolves workspace deps from this set
          cd "$SMOKE_DIR"
          npm init -y
          npm install --no-save "$PACKS_DIR"/*.tgz

          # Persist the bin dir across steps via GITHUB_PATH
          echo "$SMOKE_DIR/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify ngcompass CLI commands
        shell: bash
        run: |
          echo "--- which ngcompass ---"
          which ngcompass

          echo "--- ngcompass --help ---"
          ngcompass --help

          echo "--- ngcompass --version ---"
          ngcompass --version

          echo "--- ngcompass rules ---"
          ngcompass rules

          echo "--- ngcompass cache info ---"
          ngcompass cache info

      - name: Verify shebang preserved in dist
        shell: bash
        run: |
          SHEBANG=$(head -1 packages/cli/dist/cli.js)
          echo "First line: $SHEBANG"
          echo "$SHEBANG" | grep -q '^#!' || (echo "ERROR: shebang missing from dist/cli.js" && exit 1)

      - name: Verify NO_COLOR disables ANSI output
        shell: bash
        run: |
          OUTPUT=$(NO_COLOR=1 ngcompass --help)
          if echo "$OUTPUT" | grep -qP '\x1b\['; then
            echo "ERROR: ANSI escape codes present despite NO_COLOR=1"
            exit 1
          fi
          echo "OK: no ANSI codes detected"

      - name: Verify ngcompass init in a fresh directory
        shell: bash
        run: |
          INIT_DIR="$RUNNER_TEMP/ngcompass-init-test"
          mkdir -p "$INIT_DIR"
          ngcompass init --cwd "$INIT_DIR"
          # Confirm a config file was created
          shopt -s nullglob
          config_files=(
            "$INIT_DIR"/.ngcompassrc*
            "$INIT_DIR"/ngcompass.config.*
            "$INIT_DIR"/*.ngcompass*
          )
          if [ "${#config_files[@]}" -eq 0 ]; then
            echo "ERROR: no config file created by ngcompass init"
            exit 1
          fi
          printf '%s\n' "${config_files[@]}"
          echo "OK: config file created"

      - name: Verify analyze output formats
        shell: bash
        run: |
          ANALYZE_DIR="$RUNNER_TEMP/ngcompass-analyze-test"
          mkdir -p "$ANALYZE_DIR/src"
          ngcompass init --cwd "$ANALYZE_DIR"

          cat > "$ANALYZE_DIR/src/app.component.ts" <<'TS'
          import { ChangeDetectionStrategy, Component } from '@angular/core';

          @Component({
            selector: 'app-root',
            template: '<h1>Hello</h1>',
            changeDetection: ChangeDetectionStrategy.OnPush,
          })
          export class AppComponent {}
          TS

          cd "$ANALYZE_DIR"
          ngcompass analyze --format json --force > report.json
          node -e "JSON.parse(require('node:fs').readFileSync('report.json', 'utf8'))"

          ngcompass analyze --format sarif --force > report.sarif
          node -e "const r = JSON.parse(require('node:fs').readFileSync('report.sarif', 'utf8')); if (r.version !== '2.1.0') process.exit(1)"

          ngcompass analyze --format html --force --output report.html
          test -s report.html || (echo "ERROR: html report was not written" && exit 1)
          echo "OK: analyze output formats verified"

      - name: Verify console analyze output
        shell: bash
        run: |
          CONSOLE_DIR="$RUNNER_TEMP/ngcompass-console-test"
          mkdir -p "$CONSOLE_DIR/src"
          ngcompass init --cwd "$CONSOLE_DIR"

          cat > "$CONSOLE_DIR/src/app.component.ts" <<'TS'
          import { ChangeDetectionStrategy, Component } from '@angular/core';

          @Component({
            selector: 'app-root',
            template: '<h1>Hello</h1>',
            changeDetection: ChangeDetectionStrategy.OnPush,
          })
          export class AppComponent {}
          TS

          cd "$CONSOLE_DIR"
          NO_COLOR=1 ngcompass analyze --format console --force > console.txt 2>&1
          cat console.txt

          grep -Eq '[›❯] Running analysis' console.txt
          grep -Eq '[›❯] .*app.component.ts' console.txt
          grep -q 'ms' console.txt

          node -e "const s = require('node:fs').readFileSync('console.txt', 'utf8'); if (/\x1b\[[0-9;]*[A-Za-z]/.test(s)) { console.error('ERROR: ANSI escape codes present despite NO_COLOR=1'); process.exit(1); }"
          echo "OK: console analyze output verified"

      - name: Verify analyze exits non-zero on violations
        shell: bash
        run: |
          FAIL_DIR="$RUNNER_TEMP/ngcompass-fail-test"
          mkdir -p "$FAIL_DIR/src"
          ngcompass init --cwd "$FAIL_DIR"

          cat > "$FAIL_DIR/src/app.component.ts" <<'TS'
          import { Component } from '@angular/core';

          @Component({
            selector: 'app-root',
            template: '<button (click)="save()">Save</button>',
          })
          export class AppComponent {
            save() {}
          }
          TS

          cd "$FAIL_DIR"
          set +e
          ngcompass analyze --force --rule template-no-call-expression > output.txt 2>&1
          code=$?
          set -e

          cat output.txt
          if [ "$code" -eq 0 ]; then
            echo "ERROR: analyze exited 0 despite expected violation"
            exit 1
          fi
          grep -q 'template-no-call-expression' output.txt
          echo "OK: analyze exits non-zero on violations"

      - name: Verify exit codes
        shell: bash
        run: |
          # Known-good command must exit 0
          ngcompass --version
          [ $? -eq 0 ] || (echo "ERROR: --version exited non-zero" && exit 1)

          # Unknown command must exit non-zero
          if ngcompass __unknown_command__ 2>/dev/null; then
            echo "ERROR: unknown command exited 0"
            exit 1
          fi
          echo "OK: exit codes correct"

      - name: Publish dry-run (catch file leakage before release)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20.19.x'
        env:
          NODE_ENV: production
        shell: bash
        run: |
          pnpm exec turbo build:prod

          for pkg in packages/ast packages/cache packages/cli packages/common packages/config \
                     packages/engine packages/planner packages/reporters packages/rules packages/scanner; do
            echo "=== $pkg ==="
            (cd "$pkg" && npm publish --dry-run 2>&1)
          done

      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20.19.x'
        run: |
          pnpm test:coverage
          node scripts/check-coverage.js

      - name: Security audit
        # --prod scopes audit to runtime dependencies only (devDep vulns don't ship to users)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20.19.x'
        run: pnpm audit --audit-level high --prod

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20.19.x'
        uses: codecov/codecov-action@v4
        with:
          directory: .
          flags: unittests
          fail_ci_if_error: false
